<uiView>

  <div id="suuntoplus">

    <div class="cm-fg" style="width:100%;height:22%;">
      <div class="sp-t-m p-hc" style="top:calc(25% - 50%e);">Wind</div>

      <div class="sp-t-m" style="top:calc(70% - 50%e);left:calc(35% - 50%e)">
        <span class="f-ico" style="padding-right:4px">&#xF398;</span>
        <span>
          <eval input="/Zapp/{zapp_index}/Output/WindDirection" outputFormat="CompassHeadingDeg_Accurate"
            default="--" />
        </span>
        <span>
          <postfix />
        </span>
      </div>

      <div class="sp-t-m" style="top:calc(70% - 50%e);left:calc(60% - 50%e)">
        <span class="f-ico" style="padding-left:25px;padding-right:4px">&#xF255;</span>
        <span>
          <eval input="/Zapp/{zapp_index}/Output/TWA" outputFormat="CompassHeadingDeg_Accurate" default="--" />
        </span>
        <span>
          <postfix />
        </span>
      </div>

    </div>

    <div class="cm-fg p-hc" style="top:25%;width:2px;height:43%;opacity:0.4"></div>

    <!-- Tacks -->
    <div class="cm-mid sp-t-s" style="top:calc(30% - 100%e);left:calc(25% - 50%e)">
      Tacks
    </div>

    <div class="sp-d-s f-num" style="top:calc(37% - 50%e);left:calc(25% - 50%e)">
      <eval input="/Zapp/{zapp_index}/Output/Tacks" outputFormat="Count_Threedigits" default="0" />
    </div>

    <!-- Planing jibes -->
    <div class="cm-mid sp-t-s" style="top:calc(30% - 100%e);left:calc(75% - 50%e)">
      Planing Jibes
    </div>

    <div class="sp-d-s f-num p-hc" style="top:calc(37% - 50%e);left:calc(75% - 50%e)">
      <eval input="/Zapp/{zapp_index}/Output/PlaningJibes" outputFormat="Count_Threedigits" default="0" />
    </div>

    <!-- Non-Planing jibes -->
    <div class="cm-mid sp-t-s" style="top:calc(56% - 100%e);left:calc(75% - 50%e)">
      Non-planing Jibes
    </div>

    <div class="sp-d-s f-num p-hc" style="top:calc(63% - 50%e);left:calc(75% - 50%e)">
      <eval input="/Zapp/{zapp_index}/Output/Jibes" outputFormat="Count_Threedigits" default="0" />
    </div>

    <!-- Leg distance -->
    <div class="cm-mid sp-t-s" style="top:calc(56% - 100%e);left:calc(25% - 50%e)">
      Leg Distance
    </div>
    <div class="sp-d-s f-num p-hc" style="top:calc(63% - 50%e);left:calc(25% - 50%e);width:50%">
      <span class="p-hc">
        <eval input="/Zapp/{zapp_index}/Output/legDistance" outputFormat="{zapp_distance_format}" default="--" />
      </span>
      <span class="cm-mid sp-t-s" style="padding-top:6px;left:75%">
        <postfix />
      </span>
    </div>

    <!-- Speed -->
    <div class="cm-mid sp-t-s p-hc" style="top:calc(80% - 100%e)">
      Speed
    </div>
    <div class="sp-d-s" style="top:calc(87% - 50%e);width:100%;">
      <span class="p-hc">
        <eval input="/Activity/Current/Speed" outputFormat="{zapp_speed_format}" default="--" />
      </span>
      <span class="cm-mid sp-t-s" style="padding-top:6px;left:63%">
        <postfix />
      </span>
    </div>

  </div>

  <userInput>
    <pushButton name="up" longType="lock" onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 1, null, 'int32');" />
  </userInput>

</uiView>
